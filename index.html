<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Racing Parts | Calculadora</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: #10141a;
      --line: #28313c;
      --text: #f4f6f8;
      --muted: #8a96a5;
      --gold: #f0ad27;
      --gold2: #ffd166
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: radial-gradient(circle at 80% -10%, rgba(240, 173, 39, .14), transparent 28%), #080a0e;
      color: var(--text);
      font-family: Inter, Segoe UI, Arial, sans-serif
    }

    button,
    input,
    select {
      font: inherit
    }

    button {
      cursor: pointer
    }

    .app {
      min-height: 100vh;
      display: flex
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 245px;
      padding: 22px 15px;
      background: #090b0f;
      border-right: 1px solid var(--line);
      z-index: 5
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 3px 8px 25px
    }

    .logo-mark {
      width: 43px;
      height: 43px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, var(--gold2), #b86e00);
      color: #111;
      font-size: 21px;
      font-weight: 900
    }

    .logo-name {
      font-weight: 900;
      letter-spacing: 1.7px;
      font-size: 16px
    }

    .logo-sub {
      display: block;
      color: #687482;
      font-size: 9px;
      letter-spacing: 1.8px;
      margin-top: 3px
    }

    .nav-title {
      color: #586473;
      font-size: 10px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      padding: 0 10px 8px
    }

    .side-link {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      margin: 3px 0;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: #aeb8c4;
      text-align: left
    }

    .side-link:hover,
    .side-link.active {
      background: #191f27;
      color: #fff
    }

    .side-link.active {
      box-shadow: inset 3px 0 0 var(--gold)
    }

    .side-link .ico {
      width: 23px;
      text-align: center
    }

    .side-note {
      position: absolute;
      bottom: 20px;
      left: 22px;
      color: #56616e;
      font-size: 10px;
      line-height: 1.6
    }

    .content {
      margin-left: 245px;
      width: calc(100% - 245px);
      padding: 27px 32px 55px
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px
    }

    .eyebrow {
      color: var(--gold2);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2.2px;
      text-transform: uppercase
    }

    h1 {
      margin: 5px 0 0;
      font-size: 30px
    }

    .top-total {
      background: #141a21;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 11px 17px;
      text-align: right;
      min-width: 180px
    }

    .top-total span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase
    }

    .top-total b {
      display: block;
      color: var(--gold2);
      font-size: 19px;
      margin-top: 3px
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-bottom: 16px
    }

    .stat {
      padding: 16px 18px;
      border-radius: 14px;
      background: #12171d;
      border: 1px solid var(--line)
    }

    .stat-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.3px
    }

    .stat-value {
      font-size: 24px;
      font-weight: 900;
      margin-top: 6px
    }

    .gold {
      color: var(--gold2)
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.03fr) minmax(350px, .97fr);
      gap: 16px
    }

    .card {
      background: #10141a;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .22)
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 17px
    }

    .card-title h2 {
      margin: 0;
      font-size: 16px
    }

    .pill {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .8px;
      color: #aab4bf;
      background: #202730;
      border: 1px solid #2b3440;
      border-radius: 999px;
      padding: 5px 8px
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px
    }

    .full {
      grid-column: 1/-1
    }

    label {
      display: block;
      color: #adb7c3;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      margin-bottom: 7px
    }

    select,
    input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid #2a333e;
      background: #0c1015;
      color: #f3f5f7;
      outline: 0
    }

    select:focus,
    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(240, 173, 39, .08)
    }

    .search {
      position: relative
    }

    .search input {
      padding-left: 36px
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 30px;
      color: #65717f;
      font-size: 18px
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 15px
    }

    .btn {
      border-radius: 10px;
      padding: 12px 15px;
      font-weight: 900;
      border: 1px solid transparent
    }

    .btn-main {
      flex: 1;
      background: linear-gradient(135deg, var(--gold2), #d38b0d);
      color: #101010
    }

    .btn-clear {
      background: #20262e;
      color: #c5cdd6;
      border-color: #303945
    }

    .selected-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px;
      border: 1px solid #252e38;
      background: #13181f;
      border-radius: 11px;
      margin-bottom: 8px
    }

    .item-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: #202730;
      color: var(--gold2)
    }

    .item-main {
      min-width: 0;
      flex: 1
    }

    .item-main strong {
      font-size: 12px;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .item-main span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px
    }

    .item-price {
      font-weight: 900;
      font-size: 12px;
      white-space: nowrap
    }

    .remove-btn {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      border: 1px solid #343e49;
      background: #1b2129;
      color: #9ba5b1;
      font-size: 18px
    }

    .materials {
      border-top: 1px solid var(--line);
      margin-top: 17px;
      padding-top: 16px
    }

    .material-row {
      display: flex;
      justify-content: space-between;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 12px
    }

    .material-row:nth-child(odd) {
      background: #13181f
    }

    .material-row span {
      color: #b7c0ca
    }

    .empty {
      padding: 30px 10px;
      text-align: center;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .empty-icon {
      font-size: 30px;
      opacity: .45;
      margin-bottom: 8px
    }

    .empty strong {
      font-size: 12px;
      color: #c9d0d8
    }

    .empty span {
      font-size: 10px;
      margin-top: 4px
    }

    .empty-material {
      padding: 12px;
      text-align: center;
      color: #65717f;
      font-size: 11px
    }

    @media(max-width:950px) {
      .sidebar {
        width: 205px
      }

      .content {
        margin-left: 205px;
        width: calc(100% - 205px);
        padding: 22px
      }

      .layout {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:680px) {
      .app {
        display: block
      }

      .sidebar {
        position: relative;
        width: 100%;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 13px
      }

      .logo {
        padding-bottom: 12px
      }

      .nav {
        display: flex;
        overflow: auto;
        gap: 4px
      }

      .side-link {
        width: auto;
        white-space: nowrap;
        padding: 9px 10px
      }

      .nav-title,
      .side-note {
        display: none
      }

      .content {
        margin: 0;
        width: 100%;
        padding: 17px
      }

      .top-total {
        display: none
      }

      .stats {
        grid-template-columns: 1fr 1fr
      }

      .stats .stat:last-child {
        grid-column: 1/-1
      }

      .form-grid {
        grid-template-columns: 1fr
      }

      .full {
        grid-column: auto
      }
    }
  </style>
</head>

    </main>

    let selecionadas = [];

    function atualizarPecas() {
      const cat = document.getElementById("categoria").value, classe = document.getElementById("classe").value, stag = document.getElementById("stag").value;
      const cb = document.getElementById("classeBox"), sb = document.getElementById("stagBox"), sel = document.getElementById("peca");
      let nomes = [];
      if (cat === "stag") { cb.style.display = "block"; sb.style.display = "block"; nomes = [`Stag ${stag} ${classe}`]; }
      else if (cat === "classificada") { cb.style.display = "block"; sb.style.display = "none"; nomes = Object.keys(pecas).filter(n => (n.startsWith("Kit Relação Class ") || n.startsWith("Cambio Sequancial Class ") || n.startsWith("Tração 4X4 Class ")) && n.endsWith("Class " + classe)); }
      else if (cat === "carros") { cb.style.display = "block"; sb.style.display = "none"; nomes = Object.keys(carrosPorClasse[classe] || {}).map(n => `Carro ${classe} - ${n}`); }
      else { cb.style.display = "none"; sb.style.display = "none"; nomes = Object.keys(pecas).filter(n => !n.startsWith("Stag ") && !n.startsWith("Kit Relação Class ") && !n.startsWith("Cambio Sequancial Class ") && !n.startsWith("Tração 4X4 Class ") && !n.startsWith("Carro ")); }
      sel.innerHTML = nomes.map(n => { const label = n.startsWith("Carro ") ? n.replace(/^Carro [A-Z]+ - /, "") : n; return `<option value="${n}">${label}</option>` }).join("");
      filtrarPecas();
    }
    function filtrarPecas() {
      const q = (document.getElementById("pesquisa").value || "").toLowerCase().trim(), sel = document.getElementById("peca");
      [...sel.options].forEach(o => o.hidden = !!q && !o.text.toLowerCase().includes(q));
      const first = [...sel.options].find(o => !o.hidden); if (first) sel.value = first.value;
    }
    function dinheiro(v) { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function adicionar() {
      const nome = document.getElementById("peca").value; if (!nome) return;
      const qtd = Math.max(1, parseInt(document.getElementById("quantidade").value) || 1);
      selecionadas.push({ nome, qtd }); document.getElementById("quantidade").value = 1; render();
    }
    function remover(i) { selecionadas.splice(i, 1); render(); }
    function render() {
      const lista = document.getElementById("lista");
      if (!selecionadas.length) lista.innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><strong>Nenhuma peça adicionada</strong><span>Selecione os componentes para montar seu pedido.</span></div>`;
      else lista.innerHTML = selecionadas.map((x, i) => { const p = pecas[x.nome]; return `<div class="selected-item"><div class="item-icon">⚙</div><div class="item-main"><strong>${x.nome}</strong><span>${x.qtd} unidade(s)${p.tipo === "carro" ? " · Classe " + x.nome.match(/^Carro ([A-Z])/)[1] : " · " + ((p.exp || 0) * x.qtd) + " EXP"}</span></div><div class="item-price">${dinheiro(p.valor * x.qtd)}</div><button class="remove-btn" onclick="remover(${i})">×</button></div>` }).join("");
      let valor = 0, exp = 0, itens = 0, mats = {};
      selecionadas.forEach(x => { const p = pecas[x.nome]; valor += p.valor * x.qtd; exp += p.exp * x.qtd; itens += x.qtd; Object.entries(p.materiais).forEach(([m, q]) => mats[m] = (mats[m] || 0) + q * x.qtd); });
      document.getElementById("valor").textContent = dinheiro(valor); document.getElementById("totalTopo").textContent = dinheiro(valor); document.getElementById("exp").textContent = exp.toLocaleString("pt-BR"); document.getElementById("itens").textContent = itens; document.getElementById("badgeItens").textContent = itens + " ITENS";
      document.getElementById("materiais").innerHTML = Object.keys(mats).length ? Object.entries(mats).map(([m, q]) => `<div class="material-row"><span>${m}</span><b>${q}</b></div>`).join("") : `<div class="empty-material">Os materiais aparecerão aqui.</div>`;
    }
    function limpar() { selecionadas = []; render(); }
    function selecionarCategoria(cat) { document.getElementById("categoria").value = cat; atualizarPecas(); document.querySelectorAll(".side-link").forEach(b => b.classList.toggle("active", b.dataset.cat === cat)); document.getElementById("builder").scrollIntoView({ behavior: "smooth", block: "start" }); }
